name: Release HarmonyOS HAP (API 26 Beta2)
run-name: ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching pubspec.yaml (for example, v3.5.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: harmonyos-release
  cancel-in-progress: false

env:
  FLUTTER_REVISION: dcd184d2b8650f35120382a0db61231c6965912c
  HARMONYOS_API_VERSION: '26'
  HARMONYOS_PLATFORM_VERSION: 26.0.0
  HARMONYOS_SDK_STAGE: Beta2
  PUB_HOSTED_URL: https://pub.flutter-io.cn

jobs:
  release:
    name: Build unsigned HarmonyOS HAP
    runs-on: [self-hosted, Windows, X64, harmonyos-api26-beta2]
    timeout-minutes: 45
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true

      - name: Validate release tag
        id: release
        env:
          TAG: ${{ inputs.tag }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $tagVersion = $env:TAG -replace '^v', ''
          $versionLine = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1
          if (-not $versionLine) {
            throw 'Could not read the version from pubspec.yaml.'
          }
          $appVersion = $versionLine.Matches[0].Groups[1].Value.Split('+')[0]
          if ($appVersion -ne $tagVersion) {
            throw "pubspec version $appVersion does not match tag $env:TAG."
          }

          "tag=$env:TAG" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "asset_name=KikoFlu-ohos-$env:TAG-unsigned.hap" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Add local toolchain to PATH
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $requiredVariables = @(
            'FLUTTER_HOME',
            'HOS_SDK_HOME',
            'DEVECO_SDK_HOME',
            'OHPM_HOME',
            'HVIGOR_HOME',
            'DEVECO_NODE_HOME',
            'JAVA_HOME'
          )
          foreach ($name in $requiredVariables) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value) -or -not (Test-Path -LiteralPath $value)) {
              throw "Runner environment variable $name is missing or points to an invalid path."
            }
          }

          @(
            (Join-Path $env:FLUTTER_HOME 'bin'),
            (Join-Path $env:OHPM_HOME 'bin'),
            (Join-Path $env:HVIGOR_HOME 'bin'),
            $env:DEVECO_NODE_HOME,
            (Join-Path $env:JAVA_HOME 'bin')
          ) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          $toolchainRoot = Split-Path -Parent $env:FLUTTER_HOME
          $pubCache = Join-Path $toolchainRoot 'pub-cache'
          New-Item -ItemType Directory -Force -Path $pubCache | Out-Null
          "PUB_CACHE=$pubCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate API 26 Beta2 toolchain
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $sdkMetadataPath = Join-Path $env:HOS_SDK_HOME 'default\sdk-pkg.json'
          if (-not (Test-Path -LiteralPath $sdkMetadataPath)) {
            throw "HarmonyOS SDK metadata was not found at $sdkMetadataPath."
          }
          $sdk = Get-Content -LiteralPath $sdkMetadataPath -Raw | ConvertFrom-Json
          if ($sdk.data.apiVersion -ne $env:HARMONYOS_API_VERSION -or
              $sdk.data.platformVersion -ne $env:HARMONYOS_PLATFORM_VERSION -or
              $sdk.data.stage -ne $env:HARMONYOS_SDK_STAGE) {
            throw "Expected HarmonyOS $env:HARMONYOS_PLATFORM_VERSION API $env:HARMONYOS_API_VERSION $env:HARMONYOS_SDK_STAGE, found $($sdk.data.displayName) $($sdk.data.stage)."
          }

          $flutter = flutter --version --machine | ConvertFrom-Json
          if ($flutter.frameworkRevision -ne $env:FLUTTER_REVISION) {
            throw "Expected Flutter revision $env:FLUTTER_REVISION, found $($flutter.frameworkRevision)."
          }

          flutter config --ohos-sdk "$env:HOS_SDK_HOME"
          Write-Host "Using HarmonyOS SDK $($sdk.data.version) ($($sdk.data.stage)) and Flutter $($flutter.frameworkVersion)."

      - name: Resolve Flutter dependencies
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        shell: powershell
        run: flutter pub get --enforce-lockfile --no-example

      - name: Build unsigned release HAP
        shell: powershell
        run: flutter build hap --release --no-pub --no-codesign

      - name: Package HAP
        env:
          ASSET_NAME: ${{ steps.release.outputs.asset_name }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $hap = Get-ChildItem -LiteralPath 'build\ohos\hap' -File -Filter '*-unsigned.hap' |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if (-not $hap) {
            throw 'Unsigned HAP was not found after the release build.'
          }
          Copy-Item -LiteralPath $hap.FullName -Destination $env:ASSET_NAME

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: harmonyos-unsigned-${{ steps.release.outputs.tag }}
          path: ${{ steps.release.outputs.asset_name }}
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSET_NAME: ${{ steps.release.outputs.asset_name }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $notesPath = Join-Path 'release-notes' "$env:TAG.md"
          if (-not (Test-Path -LiteralPath $notesPath -PathType Leaf)) {
            throw "Reviewed release notes were not found at $notesPath."
          }

          $savedErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = 'SilentlyContinue'
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = $savedErrorActionPreference

          if ($releaseExists) {
            gh release upload $env:TAG $env:ASSET_NAME --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload release asset for $env:TAG."
            }
          } else {
            gh release create $env:TAG $env:ASSET_NAME `
              --repo $env:GITHUB_REPOSITORY `
              --target main `
              --title $env:TAG `
              --notes-file $notesPath
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create release $env:TAG."
            }
          }

          gh release edit $env:TAG `
            --repo $env:GITHUB_REPOSITORY `
            --title $env:TAG `
            --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to update release notes for $env:TAG."
          }
