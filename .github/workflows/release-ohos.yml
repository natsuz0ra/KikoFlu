name: Release HarmonyOS HAP (API 26 Release)
run-name: ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching pubspec.yaml (for example, v3.5.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: harmonyos-release
  cancel-in-progress: false

env:
  FLUTTER_REPOSITORY: https://gitcode.com/CPF-Flutter/flutter_flutter.git
  FLUTTER_REVISION: dcd184d2b8650f35120382a0db61231c6965912c
  HARMONYOS_CLI_VERSION: 26.0.0.821
  HARMONYOS_API_VERSION: '26'
  HARMONYOS_PLATFORM_VERSION: 26.0.0
  HARMONYOS_SDK_STAGE: Release
  PUB_HOSTED_URL: https://pub.dev

jobs:
  release:
    name: Build unsigned HarmonyOS HAP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate release tag
        id: release
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          TAG_VERSION="${TAG#v}"
          APP_VERSION="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          APP_VERSION="${APP_VERSION%%+*}"
          if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::pubspec version $APP_VERSION does not match tag $TAG."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset_name=KikoFlu-ohos-${TAG}-unsigned.hap" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git libglu1-mesa unzip xz-utils zip

      - name: Setup HarmonyOS toolchain
        uses: ErBWs/setup-ohos@v2
        with:
          version: ${{ env.HARMONYOS_CLI_VERSION }}
          cache: true

      - name: Validate API 26 Release toolchain
        shell: bash
        run: |
          set -euo pipefail

          SDK_METADATA_PATH="$HOS_SDK_HOME/default/sdk-pkg.json"
          if [ ! -f "$SDK_METADATA_PATH" ]; then
            echo "::error::HarmonyOS SDK metadata was not found at $SDK_METADATA_PATH."
            exit 1
          fi

          SDK_API_VERSION="$(jq -r '.data.apiVersion' "$SDK_METADATA_PATH")"
          SDK_PLATFORM_VERSION="$(jq -r '.data.platformVersion' "$SDK_METADATA_PATH")"
          SDK_STAGE="$(jq -r '.data.stage' "$SDK_METADATA_PATH")"
          SDK_VERSION="$(jq -r '.data.version' "$SDK_METADATA_PATH")"

          if [ "$SDK_API_VERSION" != "$HARMONYOS_API_VERSION" ] ||
             [ "$SDK_PLATFORM_VERSION" != "$HARMONYOS_PLATFORM_VERSION" ] ||
             [ "$SDK_STAGE" != "$HARMONYOS_SDK_STAGE" ]; then
            echo "::error::Expected HarmonyOS $HARMONYOS_PLATFORM_VERSION API $HARMONYOS_API_VERSION $HARMONYOS_SDK_STAGE, found SDK $SDK_VERSION ($SDK_STAGE)."
            exit 1
          fi

          echo "Using HarmonyOS SDK $SDK_VERSION ($SDK_STAGE)."

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter OHOS
        shell: bash
        run: |
          git clone "$FLUTTER_REPOSITORY" "$RUNNER_TEMP/flutter-ohos"
          git -C "$RUNNER_TEMP/flutter-ohos" checkout "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter-ohos/bin" >> "$GITHUB_PATH"

      - name: Resolve Flutter dependencies
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        run: flutter pub get --enforce-lockfile --no-example

      - name: Build unsigned release HAP
        run: flutter build hap --release --no-pub --no-codesign

      - name: Package HAP
        env:
          ASSET_NAME: ${{ steps.release.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          HAP_PATH="$(find build/ohos/hap ohos/entry/build -type f -name '*-unsigned.hap' -print -quit 2>/dev/null || true)"
          if [ -z "$HAP_PATH" ]; then
            echo "::error::Unsigned HAP was not found after the release build."
            exit 1
          fi
          cp "$HAP_PATH" "$ASSET_NAME"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: harmonyos-unsigned-${{ steps.release.outputs.tag }}
          path: ${{ steps.release.outputs.asset_name }}
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSET_NAME: ${{ steps.release.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES_PATH="release-notes/${TAG}.md"
          if [ ! -f "$NOTES_PATH" ]; then
            echo "::error::Reviewed release notes were not found at $NOTES_PATH."
            exit 1
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET_NAME" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$ASSET_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --target main \
              --title "$TAG" \
              --notes-file "$NOTES_PATH"
          fi

          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file "$NOTES_PATH"
