name: kikoeru_flutter
description: A cross-platform Flutter app for browsing and playing Kikoeru server content

publish_to: 'none'

version: 3.5.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # UI & Material Design
  cupertino_icons: ^1.0.6
  dynamic_color:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_dynamic_color.git
      ref: 3a087b36e1aedf1dafff9098c7b0d357af7d216c
      path: packages/dynamic_color
  
  # State Management
  provider: ^6.1.2
  flutter_riverpod: ^2.4.9
  
  # Network & API
  dio: ^5.4.0
  connectivity_plus:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_plus_plugins.git
      ref: 44f907d59a3d7c8c1bce7e37893564de3d81f335
      path: packages/connectivity_plus/connectivity_plus
  http: ^1.6.0
  translator: ^1.0.0
  
  # Audio & Video & Pdf
  just_audio:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_just_audio.git
      ref: af0eb7e852026b03e2e4534ef380ee47937ad995
      path: just_audio
  just_audio_media_kit: ^2.0.7
  media_kit: ^1.2.0
  media_kit_libs_windows_audio: ^1.0.9
  media_kit_libs_linux: ^1.1.5
  media_kit_libs_android_audio: ^1.1.5
  audio_service:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_audio_service.git
      ref: ac22654a6c8edc30b3d05fac4954de4b19ea85f1
      path: audio_service
  smtc_windows: ^0.1.3
  flutter_pdfview:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_flutter_pdfview.git
      ref: f9088ee57e42f74d0a79b68afba70c5ac5cc21e2
  
  # Local Storage
  shared_preferences:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      ref: 19bd50ff6d5eaa96f18c63796c51e1b4e78a7480
      path: packages/shared_preferences/shared_preferences
  path: ^1.8.3
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  sqlite3: ^2.9.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  
  # UI Components
  cached_network_image: ^3.3.0
  flutter_staggered_grid_view: ^0.7.0
  
  # Utilities
  json_annotation: ^4.8.1
  equatable: ^2.0.5
  crypto: ^3.0.3
  
  # Permissions
  permission_handler:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_permission_handler.git
      ref: 9094b9494b311dae71fe0399d9acd546a773edef
      path: permission_handler
  
  # Image & File Operations
  saver_gallery: ^4.0.1
  file_picker_ohos:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_file_picker.git
      ref: 98af21560ef18e2bc428389e07c12ab7c17b98fb
  archive: ^3.6.1
  gbk_codec: ^0.4.0
  charset: ^2.0.1
  
  # Share
  share_plus:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_plus_plugins.git
      ref: 55de300a8627c55cd45ac86e6a26bcae8e0ca4cf
      path: packages/share_plus/share_plus

  # System Integration
  url_launcher:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      ref: 1283e0312195510b92151186c655ee023b0004fb
      path: packages/url_launcher/url_launcher
  open_filex:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_open_filex.git
      ref: 63830409bc2aa4e86e1ebec30bb25c4e813a307c
  package_info_plus:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_plus_plugins.git
      ref: b7b9e4ae49a3c3f540c62b0b703d50eac6496ef3
      path: packages/package_info_plus/package_info_plus
  msix: ^3.16.12
  window_manager: ^0.4.3
  desktop_multi_window: ^0.3.0
  audio_session: ^0.2.2
  ffi: ^2.1.4

dependency_overrides:
  # Keep transitive users such as hive_flutter on the same package source while
  # adding the OHOS implementation from the reviewed 2.1.5 fork.
  path_provider:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      ref: 7cc9f4cfbd464943096dc7c87288252c543df5cb
      path: packages/path_provider/path_provider
  # cached_network_image also consumes sqflite from hosted; replace all users
  # with the API-compatible 2.4.2 OHOS fork.
  sqflite:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_sqflite.git
      ref: 1eefac74916ee14cab6b58da4d60a84153bcb758
      path: sqflite
  # just_audio and audio_service both reference the OHOS audio_session branch;
  # pin every consumer to the reviewed 0.2.2 commit.
  audio_session:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_audio_session.git
      ref: 27f404bdd8a394d6b7e2f6829f18aca8f9165fbc

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  json_serializable: ^6.7.1
  build_runner: ^2.4.7
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/
    - LICENSE

  fonts:
    - family: HarmonyOSSansApp
      fonts:
        - asset: assets/fonts/HarmonyOS_Sans_SC_w400.ttf
          weight: 400
        - asset: assets/fonts/HarmonyOS_Sans_SC_w700.ttf
          weight: 500
        - asset: assets/fonts/HarmonyOS_Sans_SC_w700.ttf
          weight: 600
        - asset: assets/fonts/HarmonyOS_Sans_SC_w700.ttf
          weight: 700
        - asset: assets/fonts/HarmonyOS_Sans_SC_w700.ttf
          weight: 800

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icons/app_icon_opaque.png"
  adaptive_icon_foreground: "assets/icons/app_icon_no_background.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_monochrome: "assets/icons/app_icon_monochrome.png"
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "assets/icons/app_icon_opaque.png"
